name: Apply N.2 browser and validation coverage

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.number == 65
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1
      - name: Reconstruct and verify incremental patch
        run: |
          cat .github/n2-inc-part* > /tmp/n2-incremental.patch.gz.b64
          printf '%s  %s\n' '1af79a8a6bea29b8ab11e66045f0c003847809d325bfe829803a99b477843c1d' '/tmp/n2-incremental.patch.gz.b64' | sha256sum -c -
          base64 -d /tmp/n2-incremental.patch.gz.b64 > /tmp/n2-incremental.patch.gz
          gunzip -c /tmp/n2-incremental.patch.gz > /tmp/n2-incremental.patch
          git apply --check /tmp/n2-incremental.patch
      - name: Apply and commit coverage
        run: |
          git apply --index /tmp/n2-incremental.patch
          rm -f .github/n2-inc-part* .github/workflows/n2-apply-incremental.yml
          git add -A
          git config user.name 'kindleops'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'test(n2): add isolated control and regression verification'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
