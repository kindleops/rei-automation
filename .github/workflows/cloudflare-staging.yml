# Remote build + Cloudflare STAGING deploy.
#
# All heavy work runs on a GitHub-hosted Ubuntu runner. Docker is used ONLY here
# -- never on a development machine.
#
# Not wired to main. Runs on the staging branch or manual dispatch, and the
# image job only starts if every correctness gate passed.

name: cloudflare-staging

on:
  push:
    branches: ["release/cloudflare-staging"]
  workflow_dispatch:
    inputs:
      skip_gates:
        description: "Skip correctness gates and go straight to image build + deploy (infra iteration only)"
        type: boolean
        default: false

concurrency:
  group: cloudflare-staging
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  gates:
    name: correctness gates (no Docker)
    runs-on: ubuntu-latest
    # Skippable ONLY via manual dispatch. A push to the staging branch always
    # runs the full gates -- nothing ships without them. This exists so a
    # credential or registry problem can be iterated in ~3 minutes instead of
    # replaying 35 minutes of already-green checks.
    if: ${{ inputs.skip_gates != true }}
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: proofdb
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # AUTH PREFLIGHT -- runs FIRST, on purpose.
      # The last two runs spent ~35 minutes passing every correctness gate and
      # then died on credentials. Validating the token up front turns a
      # 40-minute round trip into a 60-second one.
      #
      # whoami prints which accounts the token can reach and its permission
      # scopes. It never prints the token; only the LENGTH of the account id.
      - name: cloudflare auth preflight
        run: |
          echo "account id length: ${#CLOUDFLARE_ACCOUNT_ID}"
          npx wrangler whoami
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFARE_ACCOUNT_ID }}

      # Chunked: as one process this suite has been killed mid-run three times
      # (twice locally, once on a runner), each time exiting with NO summary --
      # which looks identical to success unless you check for it. The chunked
      # runner treats a missing summary as INCOMPLETE and fails the build.
      - name: apps/api critical suite (chunked)
        run: npm --prefix apps/api run test:critical:chunked

      - name: apply durability migration to the ephemeral Postgres
        run: |
          psql "$DB" -v ON_ERROR_STOP=1 -q \
            -f apps/api/supabase/migrations/20260831000000_durable_run_locks_and_idempotency_ledger.sql
        env:
          DB: postgres://postgres:postgres@127.0.0.1:5432/proofdb
          PGPASSWORD: postgres

      - name: durable-state concurrency proof (24-way)
        # The proof's fail-closed allowlist permits loopback only; the service
        # container is reached on 127.0.0.1, so the guard is satisfied without
        # being weakened.
        run: node apps/api/scripts/proof/durable-state-concurrency-proof.mjs
        env:
          DURABLE_STATE_PROOF_DB_URL: postgres://postgres:postgres@127.0.0.1:5432/proofdb
          DURABLE_STATE_PROOF_PARALLEL: 24

      - name: dashboard typecheck (784 source files)
        run: npm --prefix apps/dashboard run typecheck

      - name: dashboard build
        run: npm --prefix apps/dashboard run build

      - name: iOS fullscreen contract
        run: npm --prefix apps/dashboard run assert:fullscreen

  image:
    name: remote image build + staging deploy
    needs: gates
    runs-on: ubuntu-latest
    # Runs when gates passed, or when gates were explicitly skipped for an
    # infra-only iteration. `always()` is required because a skipped dependency
    # would otherwise skip this job too.
    if: ${{ always() && (needs.gates.result == 'success' || inputs.skip_gates == true) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: build apps/api (standalone)
        run: npm --prefix apps/api run build

      - name: build dashboard assets
        run: npm --prefix apps/dashboard run build

      # Docker runs HERE and only here.
      # Signature verified against `wrangler containers build --help`:
      #   wrangler containers build <PATH>  -t <name:tag>  [-p|--push]
      # PATH is the directory CONTAINING the Dockerfile, and is also the build
      # context -- which is why the Dockerfile's COPY paths are relative to
      # apps/api rather than to the repo root.
      # NOTE: the GitHub secrets are named CLOUDFARE_* (no "L") -- that spelling
      # is intentional here because it matches how they are stored. The env vars
      # exposed to wrangler keep the correct CLOUDFLARE_* spelling, which is what
      # wrangler actually reads. Do not "correct" the secrets.* side without
      # renaming the secrets first, or they silently resolve to empty strings.
      - name: build + push image to the Cloudflare managed registry
        run: npx wrangler containers build apps/api -t "rei-api:${GITHUB_SHA}" --push
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFARE_ACCOUNT_ID }}

      - name: pin the pushed image into the wrangler config
        run: |
          sed -i \
            -e "s#ACCOUNT_ID_PLACEHOLDER#${CLOUDFLARE_ACCOUNT_ID}#" \
            -e "s#TAG_PLACEHOLDER#${GITHUB_SHA}#" \
            infra/cloudflare/wrangler.jsonc
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFARE_ACCOUNT_ID }}

      # Deploys from a REGISTRY REFERENCE, so no Docker engine is needed at
      # deploy time. STAGING ONLY: no DNS, no custom domain, no production.
      - name: deploy staging worker + container
        run: npx wrangler deploy --config infra/cloudflare/wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFARE_ACCOUNT_ID }}
