# Agent S3 durable persistence — disposable PostgreSQL 17 proof.
# Not a deploy workflow: it never touches staging or production. It applies the
# PROPOSED migration to an ephemeral service container and runs the DB tests +
# the multi-process concurrency proof (pattern: cloudflare-staging.yml
# "durable-state concurrency proof (24-way)").
name: agent-s3-persistence

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'apps/api/src/lib/agent/**'
      - 'apps/api/tests/critical/agent-s3-*'
      - 'apps/api/tests/pg/**'
      - 'apps/api/scripts/proof/agent-s3-*.mjs'
      - 'supabase/migrations/PROPOSED_20261010120000_agent_s3_persistence*.sql'
      - 'supabase/migrations/PROPOSED_20261010130000_agent_research_ro*.sql'
      - 'supabase/migrations/PROPOSED_20261012140000_intel_runtime*.sql'
      - 'apps/api/src/lib/ai/**'
      - 'apps/api/tests/critical/agent-research*'
      - 'apps/api/scripts/agent/**'
      - 'infra/cloudflare/worker/index.ts'
      - '.github/workflows/agent-s3-persistence.yml'
      # rc-8.5.15.1 test isolation: any fixture, migration, test or harness change
      - 'scripts/db/**'
      - 'supabase/migrations/**'
      - 'supabase/tests/**'
      - 'supabase/rollbacks/**'
      - 'apps/api/tests/**'
      - 'apps/api/scripts/**'
      - 'apps/dashboard/**/*.test.*'
      # rc-8.5.21-c credential safety: the loader, every script the scan covers, package.json entries
      - 'scripts/**'
      - 'apps/dashboard/scripts/**'
      - 'apps/*/package.json'
      - 'package.json'
      - 'docs/CREDENTIAL-SAFETY.md'
      - '.github/workflows/cloudflare-staging.yml'

permissions:
  contents: read

jobs:
  # TEST ISOLATION (rc-8.5.15.1, owner boundary 2026-10-15): fixtures never carry
  # transaction control or include another file; test harnesses never name or read
  # a production target; every migration round-trip runs on a database the runner
  # creates on this ephemeral container (production-like targets are refused).
  test-isolation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0 (pinned by SHA)
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0 (pinned by SHA)
        with:
          node-version: 22
      - name: migration fixture lint
        run: node scripts/db/lint-migration-fixtures.mjs
      - name: no production target in test harnesses
        run: node scripts/db/scan-test-prod-targets.mjs
      - name: no silent credential derivation in tooling (frozen allowlist, rc-8.5.21-c)
        run: node scripts/db/scan-credential-derivation.mjs
      - name: migration round-trips on the disposable Postgres (runner)
        run: node scripts/db/run-migration-test.mjs --admin-url postgres://postgres:postgres@127.0.0.1:5432/postgres --all

  pg17:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: proofdb
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DB: postgres://postgres:postgres@127.0.0.1:5432/proofdb
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0 (pinned by SHA)
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0 (pinned by SHA)
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: migration round-trip (pretest → apply → rollback → re-apply)
        run: |
          psql "$DB" -v ON_ERROR_STOP=1 -q -f apps/api/tests/pg/supabase-shim.sql
          psql "$DB" -v ON_ERROR_STOP=1 -q -f apps/api/supabase/migrations/20260831000000_durable_run_locks_and_idempotency_ledger.sql
          psql "$DB" -v ON_ERROR_STOP=1 -f supabase/migrations/PROPOSED_20261010120000_agent_s3_persistence_pretest.sql
          psql "$DB" -v ON_ERROR_STOP=1 -q -f supabase/migrations/PROPOSED_20261010120000_agent_s3_persistence.sql
          psql "$DB" -v ON_ERROR_STOP=1 -q -f supabase/migrations/PROPOSED_20261010120000_agent_s3_persistence_rollback.sql
          psql "$DB" -v ON_ERROR_STOP=1 -f supabase/migrations/PROPOSED_20261010120000_agent_s3_persistence_pretest.sql
          psql "$DB" -v ON_ERROR_STOP=1 -q -f supabase/migrations/PROPOSED_20261010120000_agent_s3_persistence.sql

      - name: research migration round-trip (pretest → apply → verify → rollback → re-apply)
        run: |
          psql "$DB" -v ON_ERROR_STOP=1 -f supabase/migrations/PROPOSED_20261010130000_agent_research_ro_pretest.sql
          psql "$DB" -v ON_ERROR_STOP=1 -q -f supabase/migrations/PROPOSED_20261010130000_agent_research_ro.sql
          psql "$DB" -v ON_ERROR_STOP=1 -At -F ' | ' -f supabase/migrations/PROPOSED_20261010130000_agent_research_ro_verify.sql | tee /tmp/verify.txt
          if grep -q ' | f | ' /tmp/verify.txt; then echo "verify FAILED"; exit 1; fi
          psql "$DB" -v ON_ERROR_STOP=1 -q -f supabase/migrations/PROPOSED_20261010130000_agent_research_ro_rollback.sql
          psql "$DB" -v ON_ERROR_STOP=1 -f supabase/migrations/PROPOSED_20261010130000_agent_research_ro_pretest.sql
          psql "$DB" -v ON_ERROR_STOP=1 -q -f supabase/migrations/PROPOSED_20261010130000_agent_research_ro.sql

      - name: R2 runtime migration round-trip (pretest → apply → verify → posttest in BEGIN…ROLLBACK → rollback → pretest → apply)
        run: |
          psql "$DB" -v ON_ERROR_STOP=1 -q -c "create table if not exists public.system_control (key text primary key, value text, updated_at timestamptz default now()); create table if not exists public.send_queue (id bigserial primary key, queue_status text, scheduled_for timestamptz)"
          psql "$DB" -v ON_ERROR_STOP=1 -f supabase/migrations/PROPOSED_20261012140000_intel_runtime_pretest.sql
          psql "$DB" -v ON_ERROR_STOP=1 -q --single-transaction -f supabase/migrations/PROPOSED_20261012140000_intel_runtime.sql
          psql "$DB" -v ON_ERROR_STOP=1 -At -F ' | ' -f supabase/migrations/PROPOSED_20261012140000_intel_runtime_verify.sql | tee /tmp/verify-runtime.txt
          if grep -q ' | f | ' /tmp/verify-runtime.txt; then echo "runtime verify FAILED"; exit 1; fi
          psql "$DB" -v ON_ERROR_STOP=1 -f supabase/migrations/PROPOSED_20261012140000_intel_runtime_posttest.sql
          psql "$DB" -v ON_ERROR_STOP=1 -q -f supabase/migrations/PROPOSED_20261012140000_intel_runtime_rollback.sql
          psql "$DB" -v ON_ERROR_STOP=1 -f supabase/migrations/PROPOSED_20261012140000_intel_runtime_pretest.sql
          psql "$DB" -v ON_ERROR_STOP=1 -q --single-transaction -f supabase/migrations/PROPOSED_20261012140000_intel_runtime.sql

      - name: PostgREST binary (unauthorized-access tests through the REST layer)
        run: |
          curl -sSL -o /tmp/pgrst.tar.xz https://github.com/PostgREST/postgrest/releases/download/v16.4/postgrest-v16.4-linux-static-x86-64.tar.xz
          # pinned checksum (GitHub release asset digest, verified 2026-10-09)
          echo "b47ecc82fce1dcebbbc4183d839e52f07f7630c9d7ad0f54db753d1939299354  /tmp/pgrst.tar.xz" | sha256sum -c -
          tar -xJf /tmp/pgrst.tar.xz -C /tmp
          /tmp/postgrest --version

      - name: agent S3 tests (unit + disposable Postgres + PostgREST)
        working-directory: apps/api
        env:
          AGENT_PG_TEST_DB_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
          AGENT_PGRST_BIN: /tmp/postgrest
        run: >-
          NODE_ENV=test PODIO_CLIENT_ID=test PODIO_CLIENT_SECRET=test PODIO_USERNAME=test PODIO_PASSWORD=test
          INTERNAL_API_SECRET=test BUYER_WEBHOOK_SECRET=test OPS_DASHBOARD_SECRET=test APP_BASE_URL=http://localhost:3000
          node --experimental-strip-types --no-warnings=ExperimentalWarning --import ./tests/register-aliases.mjs
          --test --test-concurrency=1 tests/critical/agent-*.test.mjs

      - name: credential loader on the disposable Postgres (role-enforced read-only, rc-8.5.21-c)
        working-directory: apps/api
        env:
          LC_MIGRATION_TEST_ADMIN_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
        run: node --test --test-concurrency=1 tests/critical/prod-db-credentials-loader.test.mjs

      - name: multi-process concurrency proof (24-way, as the least-privilege agent_api role)
        run: |
          psql "$DB" -v ON_ERROR_STOP=1 -c "alter role agent_api login password 'ci-only'"
          node apps/api/scripts/proof/agent-s3-pg-concurrency-proof.mjs
        env:
          AGENT_S3_PROOF_DB_URL: postgres://agent_api:ci-only@127.0.0.1:5432/proofdb
          AGENT_S3_PROOF_PARALLEL: 24

      - name: migration isolation proof (vs entity-contact v2, when present)
        run: |
          OTHER=supabase/migrations/PROPOSED_20261009100000_entity_contact_role_evidence_v2.sql
          if [ ! -f "$OTHER" ]; then echo "entity-contact v2 migration not on this ref — skipped"; exit 0; fi
          node apps/api/scripts/proof/agent-s3-migration-isolation-proof.mjs
        env:
          AGENT_S3_PROOF_DB_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
          OTHER_MIGRATION: supabase/migrations/PROPOSED_20261009100000_entity_contact_role_evidence_v2.sql
          OTHER_ROLLBACK: supabase/migrations/PROPOSED_20261009100000_entity_contact_role_evidence_v2_rollback.sql
