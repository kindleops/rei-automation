name: N.2 Deal Desk validation

# PR #65 only: proves the canonical N.1 identity handoff and N.2 operator controls together.
on:
  pull_request:
    branches: [main]
    types: [synchronize, opened, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: n2-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'
  NODE_ENV: test
  PODIO_CLIENT_ID: test
  PODIO_CLIENT_SECRET: test
  PODIO_USERNAME: test
  PODIO_PASSWORD: test
  INTERNAL_API_SECRET: test
  BUYER_WEBHOOK_SECRET: test
  OPS_DASHBOARD_SECRET: test
  APP_BASE_URL: http://localhost:3000
  VITE_SUPABASE_URL: http://127.0.0.1:4173/_supabase_stub
  VITE_SUPABASE_ANON_KEY: fixture-anon-key

jobs:
  n2-tests-and-build:
    name: N.2 unit, integration, lint, typecheck, build
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.number == 65
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install repository dependencies
        run: npm install
      - name: Prepare command evidence directory
        run: mkdir -p proof/deal-desk-n2/commands
      - name: N.2 and N.1 dashboard unit regressions
        working-directory: apps/dashboard
        run: |
          set -o pipefail
          npx tsx --test \
            tests/unit/deal-desk-mutation-vocabularies.test.ts \
            tests/unit/deal-desk-n2-control-contract.test.ts \
            tests/unit/deal-desk-selection-continuity.test.ts \
            tests/unit/deal-desk-selection.test.ts \
            tests/unit/deal-desk-hydration.test.ts \
            tests/unit/canonical-thread-reference.test.ts \
            2>&1 | tee ../../proof/deal-desk-n2/commands/dashboard-unit.log
      - name: N.2 API mutation integration and current inbox regressions
        working-directory: apps/api
        run: |
          set -o pipefail
          {
            node --import ./tests/register-aliases.mjs --test --test-concurrency=1 tests/critical/deal-desk-n2-control-mutations.test.mjs
            node --import ./tests/register-aliases.mjs --test --test-concurrency=1 tests/critical/inbox-thread-context-route.test.mjs
            node --import ./tests/register-aliases.mjs --test --test-concurrency=1 tests/critical/inbox-canonical-row-contract.test.mjs
            node --import ./tests/register-aliases.mjs --test --test-concurrency=1 tests/critical/inbox-state-transition-matrix.test.mjs
          } 2>&1 | tee ../../proof/deal-desk-n2/commands/api-integration.log
      - name: Canonical N.2 dashboard lint
        id: dashboard_lint
        continue-on-error: true
        working-directory: apps/dashboard
        run: |
          set -o pipefail
          npx eslint \
            src/domain/inbox/resolveCanonicalThreadStateKey.ts \
            src/domain/lead-state/deal-desk-control-contract.ts \
            src/domain/lead-state/persistUniversalLeadState.ts \
            src/domain/lead-state/universal-lead-state-registry.ts \
            src/modules/inbox/canonical-thread-control-focus.ts \
            src/modules/inbox/components/ThreadStateBar.tsx \
            src/modules/inbox/useCanonicalControlMutation.ts \
            tests/unit/deal-desk-n2-control-contract.test.ts \
            tests/ui/deal-desk-n2-controls.spec.ts \
            2>&1 | tee ../../proof/deal-desk-n2/commands/dashboard-lint.log
      - name: API critical lint
        id: api_lint
        continue-on-error: true
        working-directory: apps/api
        run: |
          set -o pipefail
          npm run lint 2>&1 | tee ../../proof/deal-desk-n2/commands/api-lint.log
      - name: Dashboard typecheck
        id: dashboard_typecheck
        continue-on-error: true
        run: |
          set -o pipefail
          npm --workspace apps/dashboard run typecheck 2>&1 | tee proof/deal-desk-n2/commands/dashboard-typecheck.log
      - name: Dashboard build
        id: dashboard_build
        continue-on-error: true
        run: |
          set -o pipefail
          npm --workspace apps/dashboard run build 2>&1 | tee proof/deal-desk-n2/commands/dashboard-build.log
      - name: Upload command evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deal-desk-n2-command-evidence
          path: proof/deal-desk-n2/commands/
          if-no-files-found: error
          retention-days: 30
      - name: Enforce compiler and lint outcomes
        if: always()
        env:
          DASHBOARD_LINT: ${{ steps.dashboard_lint.outcome }}
          API_LINT: ${{ steps.api_lint.outcome }}
          DASHBOARD_TYPECHECK: ${{ steps.dashboard_typecheck.outcome }}
          DASHBOARD_BUILD: ${{ steps.dashboard_build.outcome }}
        run: |
          printf 'dashboard_lint=%s\napi_lint=%s\ndashboard_typecheck=%s\ndashboard_build=%s\n' "$DASHBOARD_LINT" "$API_LINT" "$DASHBOARD_TYPECHECK" "$DASHBOARD_BUILD"
          test "$DASHBOARD_LINT" = success
          test "$API_LINT" = success
          test "$DASHBOARD_TYPECHECK" = success
          test "$DASHBOARD_BUILD" = success

  n2-browser:
    name: N.2 isolated browser and N.1 continuity
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.number == 65
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install repository dependencies
        run: npm install
      - name: Build dashboard for isolated preview
        run: npm --workspace apps/dashboard run build
      - name: Install Chromium
        working-directory: apps/dashboard
        run: npx playwright install --with-deps chromium
      - name: Run N.2 controls and N.1 selection browser proofs
        id: browser_proof
        continue-on-error: true
        working-directory: apps/dashboard
        run: |
          set -o pipefail
          mkdir -p proof/deal-desk-n2/commands
          npx playwright test tests/ui/deal-desk-n2-controls.spec.ts tests/ui/deal-desk-selection-continuity.spec.ts --reporter=line 2>&1 | tee proof/deal-desk-n2/commands/browser.log
      - name: Upload redacted browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deal-desk-n2-browser-evidence
          path: |
            apps/dashboard/proof/deal-desk-n2/
            apps/dashboard/proof/deal-desk-selection/
            apps/dashboard/test-results/playwright/
          if-no-files-found: warn
          retention-days: 30
      - name: Enforce browser outcome
        if: always()
        env:
          BROWSER_PROOF: ${{ steps.browser_proof.outcome }}
        run: |
          printf 'browser_proof=%s\n' "$BROWSER_PROOF"
          test "$BROWSER_PROOF" = success
