name: Apply N.2 preview build fixes

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.number == 65
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1
      - name: Apply build fixes
        run: |
          cat > /tmp/n2-fix.patch <<'PATCH'
          diff --git a/apps/dashboard/src/modules/inbox/components/IntelligencePanel.tsx b/apps/dashboard/src/modules/inbox/components/IntelligencePanel.tsx
          index da34262..7fd62db 100644
          --- a/apps/dashboard/src/modules/inbox/components/IntelligencePanel.tsx
          +++ b/apps/dashboard/src/modules/inbox/components/IntelligencePanel.tsx
          @@ -29,7 +29,6 @@ import {
             automationStateVisuals,
             getSellerStageVisual,
             getStatusVisual,
          -  inboxStatusOptions,
             sellerStageOptions,
             statusStyleVars,
           } from '../status-visuals'
          @@ -3067,8 +3066,6 @@ const ContactIntelligenceCard = ({
           export const SellerCommandCard = ({
             thread,
             phase3,
          -  onStatusChange,
          -  onStageChange,
           }: {
             thread: WorkflowThread
             phase3: Phase3Intelligence | null
          diff --git a/apps/dashboard/src/modules/inbox/components/ThreadStateBar.tsx b/apps/dashboard/src/modules/inbox/components/ThreadStateBar.tsx
          index cb02457..010e634 100644
          --- a/apps/dashboard/src/modules/inbox/components/ThreadStateBar.tsx
          +++ b/apps/dashboard/src/modules/inbox/components/ThreadStateBar.tsx
          @@ -12,21 +12,17 @@ import {
           import {
             AUTOMATION_MODE_META,
             OPERATOR_SELECTABLE_AUTOMATION_MODES,
          -  describeVocabularyRejection,
             resolveLeadTemperatureForWrite,
             resolveLifecycleStageForWrite,
             resolveOperationalStatusForWrite,
             resolveOperatorAutomationMode,
          -  type AutomationModeCode,
             type VocabularyResolution,
           } from '../../../domain/lead-state/canonical-control-vocabularies'
           import {
             LEAD_TEMPERATURE_ORDER,
             LIFECYCLE_STAGE_ORDER,
             OPERATIONAL_STATUS_ORDER,
          -  type LeadTemperatureCode,
             type LifecycleStageCode,
          -  type OperationalStatusCode,
           } from '../../../domain/lead-state/universal-lead-state-registry'
           import {
             buildOperatorAutomationPatch,
          PATCH
          git apply --check /tmp/n2-fix.patch
          git apply --index /tmp/n2-fix.patch
          rm -f .github/workflows/n2-fix-build.yml
          git add -A
          git config user.name 'kindleops'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'fix(n2): remove stale writable-control bindings'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
