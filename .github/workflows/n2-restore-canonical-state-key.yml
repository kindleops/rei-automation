name: Restore canonical N.1 state-key handoff

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.number == 65
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1
      - name: Restore canonical state-key handoff
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('apps/dashboard/src/modules/inbox/InboxPage.tsx')
          source = path.read_text()
          old_import = "import { focusCanonicalThreadControl } from './canonical-thread-control-focus'\nimport { resolveThreadRouteKey } from '../../domain/inbox/canonical-thread-reference'\n"
          new_import = "import { focusCanonicalThreadControl } from './canonical-thread-control-focus'\nimport { resolveThreadRouteKey } from '../../domain/inbox/canonical-thread-reference'\nimport { resolveCanonicalThreadStateKey } from '../../domain/inbox/resolveCanonicalThreadStateKey'\n"
          if old_import not in source:
              raise SystemExit('canonical import anchor not found')
          source = source.replace(old_import, new_import, 1)

          old_case = """        case 'read':\n        case 'unread':\n          setActiveContext(buildContextFromThread(thread, 'inbox'), { preserveCurrentViews: true })\n          selectThread(thread)\n          window.setTimeout(() => focusCanonicalThreadControl('is_read'), 0)\n          return\n"""
          new_case = """        case 'read':\n        case 'unread': {\n          const canonicalStateKey = resolveCanonicalThreadStateKey(thread)\n          if (DEV && !canonicalStateKey) {\n            console.info('[DealDesk] opening canonical read control without a writable route')\n          }\n          setActiveContext(buildContextFromThread(thread, 'inbox'), { preserveCurrentViews: true })\n          selectThread(thread)\n          window.setTimeout(() => focusCanonicalThreadControl('is_read'), 0)\n          return\n        }\n"""
          if old_case not in source:
              raise SystemExit('read/unread handoff anchor not found')
          path.write_text(source.replace(old_case, new_case, 1))
          PY
          rm -f .github/workflows/n2-restore-canonical-state-key.yml
          git add -A
          git config user.name 'kindleops'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'fix(n2): preserve canonical state-key handoff'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
