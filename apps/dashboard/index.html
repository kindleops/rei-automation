<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#06080e" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="NEXUS" />
    <!-- Build identity, readable before React mounts. Lets a handset be
         identified from the document alone when the app fails to boot. -->
    <meta name="nx-build-sha" content="__NEXUS_BUILD_SHA__" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="stylesheet" crossorigin href="__NEXUS_MAIN_CSS__" id="nexus-main-css" />
    <title>NEXUS Command Center</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      (function () {
        var KEY = 'nexus:sw-recovery-generation'
        var GEN = '6'
        var ENTRY = '__NEXUS_MAIN_ENTRY__'
        var CSS = '__NEXUS_MAIN_CSS__'
        var loaded = false

        // Storage access throws when cookies are blocked (iOS private mode). A
        // bootstrap that throws never mounts the app, so every access is guarded
        // and a failure degrades to "clean up, but never reload".
        function readMark() {
          try {
            return localStorage.getItem(KEY) || sessionStorage.getItem(KEY)
          } catch (e) { return null }
        }

        function writeMark() {
          var ok = false
          try { localStorage.setItem(KEY, GEN); ok = true } catch (e) { /* blocked */ }
          try { sessionStorage.setItem(KEY, GEN); ok = true } catch (e) { /* blocked */ }
          return ok
        }

        // The cache-buster is a transient reload argument, never part of the
        // installed start URL. Scope matching is path-based, so adding and
        // removing a query param cannot knock the PWA out of standalone.
        function stripBuster() {
          try {
            var u = new URL(location.href)
            if (!u.searchParams.has('nxsw')) return
            u.searchParams.delete('nxsw')
            history.replaceState(null, '', u.pathname + (u.search || '') + u.hash)
          } catch (e) { /* cosmetic only */ }
        }

        function reloadFresh() {
          try {
            var u = new URL(location.href)
            u.searchParams.set('nxsw', GEN)
            location.replace(u.toString())
          } catch (e) { location.reload() }
        }

        function ensureMainStylesheet() {
          if (!CSS || CSS.indexOf('__NEXUS_') === 0) return
          if (document.getElementById('nexus-main-css')) return
          var link = document.createElement('link')
          link.id = 'nexus-main-css'
          link.rel = 'stylesheet'
          link.crossOrigin = 'anonymous'
          link.href = CSS
          document.head.appendChild(link)
        }

        function loadApp() {
          if (loaded) return
          loaded = true
          ensureMainStylesheet()
          var script = document.createElement('script')
          script.type = 'module'
          script.crossOrigin = 'anonymous'
          script.src = ENTRY
          document.body.appendChild(script)
        }

        stripBuster()

        if (readMark() === GEN) {
          loadApp()
          return
        }

        if (!('serviceWorker' in navigator)) {
          writeMark()
          loadApp()
          return
        }

        var hadController = Boolean(navigator.serviceWorker.controller)

        navigator.serviceWorker.getRegistrations().then(function (regs) {
          return Promise.all(regs.map(function (reg) { return reg.unregister() })).then(function () {
            return regs.length > 0 || hadController
          })
        }).then(function (hadWorker) {
          if (!('caches' in window)) return hadWorker
          // Every CacheStorage entry on this origin was created by the retired
          // worker — this build ships none and registers none, so there is no
          // cache worth keeping. Cookies, localStorage, sessionStorage and user
          // preferences are deliberately untouched.
          return caches.keys().then(function (keys) {
            if (!keys.length) return hadWorker
            return Promise.all(keys.map(function (key) {
              return caches.delete(key)
            })).then(function () { return true })
          })
        }).then(function (hadWorker) {
          var marked = writeMark()
          // Reload only when stale state was actually found AND the marker
          // persisted. Without a durable marker a reload would loop forever, so
          // the unmarkable case mounts the app on the assets it already has.
          if (hadWorker && marked) {
            reloadFresh()
            return
          }
          loadApp()
        }).catch(function () {
          // Cleanup is best-effort. The app must mount either way.
          writeMark()
          loadApp()
        })
      })()
    </script>
  </body>
</html>
